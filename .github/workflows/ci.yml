name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # Assessment fixtures require HEAD and HEAD~1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run check:format
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:trace-business -- --node-only --release
      - name: Verify credential and request security boundaries
        run: npm run verify:security -- --node-only --release
      - name: Check offline ASR and MT evaluation plumbing (no quality scores or paid calls)
        run: npm run quality:asr-mt -- offline --release
      - name: Check offline semantic review plumbing (no human or model quality approval)
        run: npm run quality:semantic -- offline --release
      - name: Verify relation property and evidence contract
        run: npm run verify -- --release
      - name: Preserve test progress and watchdog diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            test-evidence/
            verification-evidence/
          retention-days: 14
          if-no-files-found: warn

  relation-protocol:
    name: Relation protocol model and SQLite replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:relation-protocol
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:relation-protocol -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relation-protocol-evidence-${{ github.sha }}
          path: verification-evidence/relation-protocol/
          retention-days: 14
          if-no-files-found: warn

  import-protocol:
    name: Import preview protocol and HTTP/SQLite replay
    runs-on: ubuntu-24.04
    # Fixed12min fast profile plus checksum tool setup and failure artifact upload.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:relation-protocol
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:import-protocol -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-protocol-evidence-${{ github.sha }}
          path: verification-evidence/import-protocol/
          retention-days: 14
          if-no-files-found: warn

  knowledge-protocol:
    name: Knowledge protocol model and SQLite replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:knowledge-protocol
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:knowledge-protocol -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-protocol-evidence-${{ github.sha }}
          path: verification-evidence/knowledge-protocol/
          retention-days: 14
          if-no-files-found: warn

  scheduler:
    name: Scheduler admission, conditional fairness and real replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:scheduler
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:scheduler -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduler-evidence-${{ github.sha }}
          path: verification-evidence/scheduler/
          retention-days: 14
          if-no-files-found: warn

  playback-protocol:
    name: Playback protocol model and real player replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:playback-protocol
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:playback-protocol -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playback-protocol-evidence-${{ github.sha }}
          path: verification-evidence/playback-protocol/
          retention-days: 14
          if-no-files-found: warn

  browser:
    name: Chromium speech fixture (stub providers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:browser
      - run: npm run preflight:browser
      - name: Run browser fixture and capture screenshots
        shell: bash
        run: npm run test:browser
        env:
          SPEECH_SEEK_EVIDENCE_DIR: browser-evidence
          GRAPH_EVIDENCE_DIR: browser-evidence
          TRACE_EVIDENCE_DIR: browser-evidence
          TRANSCRIPT_EVIDENCE_DIR: browser-evidence
          KNOWLEDGE_EDIT_EVIDENCE_DIR: browser-evidence
          SPEECH_SCREENSHOT: browser-evidence/speech.png
          PINNED_SCREENSHOT: browser-evidence/pinned-caption.png
          SPEECH_TRANSCRIPT_SCREENSHOT: browser-evidence/transcript.png
          CAPTION_PANEL_SCREENSHOT: browser-evidence/caption-panel.png
          SPEECH_PANEL_SCREENSHOT: browser-evidence/speech-panel.png
          SPEECH_SETTINGS_SCREENSHOT: browser-evidence/speech-settings.png
          FISH_SETTINGS_SCREENSHOT: browser-evidence/fish-settings.png
          INCREMENTAL_SETTINGS_SCREENSHOT: browser-evidence/incremental-settings.png
          INCREMENTAL_SETTINGS_MOBILE_SCREENSHOT: browser-evidence/incremental-settings-mobile.png
          INCREMENTAL_SCREENSHOT: browser-evidence/incremental-caption.png
          INCREMENTAL_CORRECTION_SCREENSHOT: browser-evidence/incremental-correction.png
          CAPTION_SIZE_DESKTOP_MIN_SCREENSHOT: browser-evidence/caption-size-desktop-min.png
          CAPTION_SIZE_DESKTOP_MAX_SCREENSHOT: browser-evidence/caption-size-desktop-max.png
          CAPTION_SIZE_MOBILE_MIN_SCREENSHOT: browser-evidence/caption-size-mobile-min.png
          CAPTION_SIZE_MOBILE_MAX_SCREENSHOT: browser-evidence/caption-size-mobile-max.png
          CAPTION_SIZE_PINNED_DESKTOP_MIN_SCREENSHOT: browser-evidence/caption-size-pinned-desktop-min.png
          CAPTION_SIZE_PINNED_DESKTOP_MAX_SCREENSHOT: browser-evidence/caption-size-pinned-desktop-max.png
          CAPTION_SIZE_PINNED_MOBILE_MIN_SCREENSHOT: browser-evidence/caption-size-pinned-mobile-min.png
          CAPTION_SIZE_PINNED_MOBILE_MAX_SCREENSHOT: browser-evidence/caption-size-pinned-mobile-max.png
      - name: Preserve evidence for this tested commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.sha }}
          path: browser-evidence/
          retention-days: 14
          if-no-files-found: warn

  revision:
    name: Lean revision proofs and JavaScript differential
    runs-on: ubuntu-latest
    # Two independent 360s profile deadlines plus installation/artifact overhead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install fixed, checksum-verified Lean toolchain
        shell: bash
        run: |
          scripts/setup-revision-lean.sh "$RUNNER_TEMP/hearwise-lean"
          echo "$RUNNER_TEMP/hearwise-lean/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Prove, audit axioms, compare JavaScript and check frozen revisions
        run: npm run verify:revision -- --release
      - name: Prove UTF-16 name intervals and compare public replacements
        run: npm run verify:name-interval -- --release
      - name: Preserve name interval proof and SQLite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: name-interval-evidence-${{ github.sha }}
          path: name-interval-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve proof and differential evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: revision-evidence-${{ github.sha }}
          path: revision-evidence/
          retention-days: 14
          if-no-files-found: warn
  edit-protocol:
    name: Edit protocol model and SQLite replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:edit-protocol
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:edit-protocol -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edit-protocol-evidence-${{ github.sha }}
          path: verification-evidence/edit-protocol/
          retention-days: 14
          if-no-files-found: warn

  process-crash:
    name: Process SIGKILL recovery model and SQLite replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:process-crash
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:process-crash -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve model, replay and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-crash-evidence-${{ github.sha }}
          path: verification-evidence/process-crash/
          retention-days: 14
          if-no-files-found: warn


  generation-protocol:
    name: Cancellation generations, finite models and actual late callbacks
    runs-on: ubuntu-latest
    # Fixed 35m worker budget plus bounded supervisor/setup/artifact overhead.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run setup:generation-protocol
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - run: npm run verify:generation-protocol -- --release
        env:
          QUINT_HOME: ${{ runner.temp }}/hearwise-quint
      - name: Preserve exact finite domains, native ITF and raw late-callback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generation-protocol-evidence-${{ github.sha }}
          path: verification-evidence/generation-protocol/
          retention-days: 14
          if-no-files-found: warn

  m1-protocols:
    name: M1 AC-P01–P12 current-source evidence gate
    needs: [relation-protocol, knowledge-protocol, process-crash, generation-protocol]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relation-protocol-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: knowledge-protocol-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: process-crash-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: generation-protocol-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs
      - name: Revalidate all four domain reports against this exact checkout
        shell: bash
        run: |
          set -euo pipefail
          args=(--release --output verification-evidence/m1-report.json)
          for spec in relation:relation-protocol knowledge:knowledge-protocol process:process-crash generation:generation-protocol; do
            domain=${spec%%:*}
            artifact=${spec#*:}
            root="verification-evidence/m1-inputs/${artifact}-evidence-${{ github.sha }}"
            if test -d "$root"; then
              mapfile -t reports < <(find "$root" -name report.json -type f)
              if test "${#reports[@]}" -eq 1; then args+=("--$domain" "$(dirname "${reports[0]}")"); fi
            fi
          done
          npm run verify:m1:report -- "${args[@]}"
      - name: Preserve current-source acceptance matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-evidence-${{ github.sha }}
          path: verification-evidence/m1-report.json
          retention-days: 14
          if-no-files-found: warn
