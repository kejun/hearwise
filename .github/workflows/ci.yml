name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance_baseline:
        description: 'Opt in to long full baseline (up to 80 min); routine performance smoke is capped at 10 min'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-smoke:
    name: History and graph measurement collector smoke
    runs-on: ubuntu-24.04
    # Includes setup, a 7.5-minute bounded pair deadline, and artifact upload.
    # Same-source calibration exercises the pipeline; no approved targets, no release pass.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:browser
      - run: npm run preflight:browser
      - name: Prepare frozen real SQLite and collect actual UI measurements
        shell: bash
        run: |
          set -euo pipefail
          npm run performance:bounded -- . . verification-evidence/performance
          pair="$(find verification-evidence/performance -maxdepth 2 -name pair.json -type f)"
          test "$(printf '%s\n' "$pair" | wc -l)" -eq 1
          npm run performance:bounded:report -- "$(dirname "$pair")"
          node scripts/check-performance-bounded-negative.mjs "$(dirname "$pair")"
      - name: Preserve measurements including incomplete browser attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-smoke-evidence-${{ github.sha }}
          path: verification-evidence/performance/
          retention-days: 14
          if-no-files-found: warn

  performance-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_baseline
    name: Full history and graph baseline collection (targets not frozen)
    runs-on: ubuntu-24.04
    # Separate 30-minute preparation and 40-minute collection watchdogs plus setup.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:browser
      - run: npm run preflight:browser
      - name: Collect all declared tiers and network profiles
        shell: bash
        run: |
          set -euo pipefail
          npm run performance:prepare -- verification-evidence/performance baseline
          prepared="$(find verification-evidence/performance -name prepared.json -type f)"
          test "$(printf '%s\n' "$prepared" | wc -l)" -eq 1
          npm run performance:collect -- "$prepared" baseline
          report="$(find verification-evidence/performance -maxdepth 2 -name report.json -type f)"
          test "$(printf '%s\n' "$report" | wc -l)" -eq 1
          npm run performance:report -- "$(dirname "$report")" --release-collection
      - name: Preserve exact workloads and full raw baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-baseline-evidence-${{ github.sha }}
          path: verification-evidence/performance/
          retention-days: 14
          if-no-files-found: warn

  test:
    name: Node 24 deterministic tests
    runs-on: ubuntu-latest
    # The 167-file run took 546s before the required post-test profiles in CI.
    # Bound setup, all existing profiles and cleanup without changing child caps.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # Assessment fixtures require HEAD and HEAD~1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Select the runner's Java 21
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run check:format
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:import-atomicity -- --node-only --release
      - run: npm run verify:trace-business -- --node-only --release
      - name: Verify credential and request security boundaries
        run: npm run verify:security -- --node-only --release
      - name: Check offline ASR and MT evaluation plumbing (no quality scores or paid calls)
        run: npm run quality:asr-mt -- offline --release
      - name: Check offline semantic review plumbing (no human or model quality approval)
        run: npm run quality:semantic -- offline --release
      - name: Verify relation property and evidence contract
        run: npm run verify -- --release
      - name: Preserve test progress and watchdog diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            test-evidence/
            verification-evidence/
          retention-days: 14
          if-no-files-found: warn

  relation-protocol:
    name: Relation protocol model and SQLite replay
