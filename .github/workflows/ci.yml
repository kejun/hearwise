  m1-protocols:
    name: M1 AC-P01–P12 current-source evidence gate
    needs: [relation-protocol, knowledge-protocol, process-crash, generation-protocol]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relation-protocol-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs/relation-protocol-evidence-${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: knowledge-protocol-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs/knowledge-protocol-evidence-${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: process-crash-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs/process-crash-evidence-${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: generation-protocol-evidence-${{ github.sha }}
          path: verification-evidence/m1-inputs/generation-protocol-evidence-${{ github.sha }}
      - name: Revalidate all four domain reports against this exact checkout
        shell: bash
        run: |
          set -euo pipefail
          args=(--release --output verification-evidence/m1-report.json)
          for spec in relation:relation-protocol knowledge:knowledge-protocol process:process-crash generation:generation-protocol; do
            domain=${spec%%:*}
            artifact=${spec#*:}
            root="verification-evidence/m1-inputs/${artifact}-evidence-${{ github.sha }}"
            if test -d "$root"; then
              mapfile -t reports < <(find "$root" -name report.json -type f)
              if test "${#reports[@]}" -eq 1; then args+=("--$domain" "$(dirname "${reports[0]}")"); fi
            fi
          done
          npm run verify:m1:report -- "${args[@]}"
      - name: Preserve current-source acceptance matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-evidence-${{ github.sha }}
          path: verification-evidence/m1-report.json
          retention-days: 14
          if-no-files-found: warn

  release-evidence:
    name: Current-source technical evidence gate
    if: always()
    needs: [test, relation-protocol, knowledge-protocol, import-protocol, edit-protocol, process-crash, playback-protocol, scheduler, name-protocol, browser, revision, generation-protocol, m1-protocols, install-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-evidence-${{ github.sha }}'
          path: verification-evidence/ci-input
      - name: Bind reports from all existing required jobs
        run: npm run verify:release:manifest -- --artifact-root=verification-evidence/ci-input --source=${{ github.sha }} --output=verification-evidence/release-manifest.json
      - name: Revalidate raw technical evidence and expose remaining acceptance gaps
        env:
          VERIFICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run verify:release -- --purpose=pr --manifest=verification-evidence/release-manifest.json --base="$VERIFICATION_BASE" --output=verification-evidence/release-summary.json
      - name: Preserve impact plan and explicit release gaps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            verification-evidence/release-manifest.json
            verification-evidence/release-summary.json
          retention-days: 14
          if-no-files-found: warn

  install-upgrade:
    name: Clean install and historical SQLite upgrade recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run preflight
      - run: npm run verify:upgrade -- --release
      - name: Preserve installation, raw migration and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-upgrade-evidence-${{ github.sha }}
          path: verification-evidence/upgrade/
          retention-days: 14
          if-no-files-found: warn
